
AWSTemplateFormatVersion: '2010-09-09'

Description: >
  Event-driven serverless file processing using Amazon S3,
  AWS Lambda in a private subnet, VPC, NAT Gateway and SNS.

Parameters:

  NotificationEmail:
    Type: String
    Default: ''
    Description: Email address for SNS notifications

  EnableS3Endpoint:
    Type: String
    Default: 'true'
    AllowedValues:
      - 'true'
      - 'false'
    Description: Enable private S3 Gateway VPC Endpoint

  BucketName:
    Type: String
    Description: Globally unique lowercase S3 bucket name
    AllowedPattern: '^[a-z0-9][a-z0-9-]{1,61}[a-z0-9]$'
    ConstraintDescription: >
      Use 3-63 lowercase letters, numbers or hyphens.
      Start and end with a letter or number.

Conditions:

  CreateEmailSubscription: !Not
    - !Equals
      - !Ref NotificationEmail
      - ''

  CreateS3Endpoint: !Equals
    - !Ref EnableS3Endpoint
    - 'true'

Resources:

  # VPC AND NETWORKING

  FileProcessingVPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: FileProcessingVPC

  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref FileProcessingVPC
      CidrBlock: 10.0.1.0/24
      MapPublicIpOnLaunch: true
      AvailabilityZone: !Select
        - 0
        - !GetAZs ''
      Tags:
        - Key: Name
          Value: FileProcessing-Public-Subnet

  PrivateSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref FileProcessingVPC
      CidrBlock: 10.0.2.0/24
      MapPublicIpOnLaunch: false
      AvailabilityZone: !Select
        - 0
        - !GetAZs ''
      Tags:
        - Key: Name
          Value: FileProcessing-Private-Subnet

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: FileProcessing-IGW

  AttachInternetGateway:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref FileProcessingVPC
      InternetGatewayId: !Ref InternetGateway

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref FileProcessingVPC
      Tags:
        - Key: Name
          Value: Public-Route-Table

  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: AttachInternetGateway
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetRouteAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId: !Ref PublicRouteTable

  NatElasticIP:
    Type: AWS::EC2::EIP
    DependsOn: AttachInternetGateway
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: FileProcessing-NAT-EIP

  NatGateway:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NatElasticIP.AllocationId
      SubnetId: !Ref PublicSubnet
      ConnectivityType: public
      Tags:
        - Key: Name
          Value: FileProcessing-NAT

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref FileProcessingVPC
      Tags:
        - Key: Name
          Value: Private-Route-Table

  PrivateDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: NatGateway
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway

  PrivateSubnetRouteAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet
      RouteTableId: !Ref PrivateRouteTable

  LambdaSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Lambda outbound access
      VpcId: !Ref FileProcessingVPC
      SecurityGroupEgress:
        - IpProtocol: '-1'
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: Lambda-Security-Group

  # OPTIONAL S3 GATEWAY ENDPOINT

  S3GatewayEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Condition: CreateS3Endpoint
    Properties:
      VpcId: !Ref FileProcessingVPC
      VpcEndpointType: Gateway
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.s3'
      RouteTableIds:
        - !Ref PrivateRouteTable

  # SNS NOTIFICATION

  FileProcessingTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: FileProcessingAlerts
      DisplayName: File Processing Alerts

  EmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: CreateEmailSubscription
    Properties:
      Protocol: email
      Endpoint: !Ref NotificationEmail
      TopicArn: !Ref FileProcessingTopic

  # IAM EXECUTION ROLE

  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole

      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole'

      Policies:
        - PolicyName: FileProcessingPermissions
          PolicyDocument:
            Version: '2012-10-17'
            Statement:

              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                Resource: !Sub
                  'arn:${AWS::Partition}:s3:::${BucketName}/*'

              - Effect: Allow
                Action:
                  - sns:Publish
                Resource: !Ref FileProcessingTopic

  # LAMBDA FUNCTION

  ProcessingLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: FileProcessingLambda
      Runtime: python3.12
      Handler: index.lambda_handler
      Timeout: 60
      MemorySize: 256

      Role: !GetAtt LambdaExecutionRole.Arn

      VpcConfig:
        SubnetIds:
          - !Ref PrivateSubnet
        SecurityGroupIds:
          - !Ref LambdaSecurityGroup

      Environment:
        Variables:
          SNS_TOPIC_ARN: !Ref FileProcessingTopic

      Code:
        ZipFile: |
          import json
          import os
          import urllib.parse
          import boto3
          from datetime import datetime, timezone

          s3 = boto3.client('s3')
          sns = boto3.client('sns')

          def lambda_handler(event, context):
              results = []

              for record in event.get('Records', []):
                  bucket = record['s3']['bucket']['name']
                  key = urllib.parse.unquote_plus(
                      record['s3']['object']['key']
                  )

                  # Prevent recursive processing
                  if key.startswith('processed/'):
                      continue

                  try:
                      response = s3.get_object(
                          Bucket=bucket,
                          Key=key
                      )

                      content = response['Body'].read()

                      metadata = {
                          'source_bucket': bucket,
                          'source_key': key,
                          'file_size_bytes': len(content),
                          'processed_at': datetime.now(
                              timezone.utc
                          ).isoformat(),
                          'status': 'SUCCESS'
                      }

                      log_key = (
                          'processed/' + key + '.metadata.json'
                      )

                      s3.put_object(
                          Bucket=bucket,
                          Key=log_key,
                          Body=json.dumps(metadata, indent=2),
                          ContentType='application/json'
                      )

                      sns.publish(
                          TopicArn=os.environ['SNS_TOPIC_ARN'],
                          Subject='File Processing Successful',
                          Message=json.dumps(metadata, indent=2)
                      )

                      results.append(metadata)

                  except Exception as error:
                      print(f'Processing failed: {str(error)}')
                      raise

              return {
                  'statusCode': 200,
                  'body': json.dumps(results)
              }

  # LAMBDA INVOCATION PERMISSION

  LambdaInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt ProcessingLambda.Arn
      Action: lambda:InvokeFunction
      Principal: s3.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !Sub
        'arn:${AWS::Partition}:s3:::${BucketName}'

  # S3 STORAGE

  FileBucket:
    Type: AWS::S3::Bucket
    DependsOn: LambdaInvokePermission
    Properties:
      BucketName: !Ref BucketName

      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true

      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

      NotificationConfiguration:
        LambdaConfigurations:
          - Event: s3:ObjectCreated:*
            Function: !GetAtt ProcessingLambda.Arn

      Tags:
        - Key: Name
          Value: FileProcessingBucket

Outputs:

  S3BucketName:
    Description: S3 upload bucket
    Value: !Ref FileBucket

  LambdaFunctionName:
    Description: Processing Lambda function
    Value: !Ref ProcessingLambda

  SNSTopicArn:
    Description: SNS notification topic
    Value: !Ref FileProcessingTopic

  VPCId:
    Description: Created VPC
    Value: !Ref FileProcessingVPC

  PublicSubnetId:
    Description: Public subnet
    Value: !Ref PublicSubnet

  PrivateSubnetId:
    Description: Private subnet
    Value: !Ref PrivateSubnet
